<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The requested Crux Horizon page could not be found.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/images/brand/favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="Page not found — Crux Horizon">
  <meta property="og:description" content="The requested Crux Horizon page could not be found.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Crux Horizon">

  <title>Page not found — Crux Horizon</title>
  <link rel="stylesheet" href="/assets/css/site.css">

  <style>
    :root {
      --max-width: 900px;
    }

    body {
      line-height: 1.7;
    }

    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
    }

    .site-header {
      padding: 24px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      text-decoration: none;
    }

    .eyebrow,
    .contact-link {
      color: var(--accent);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      border-color: var(--accent);
      color: var(--text);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 110px 0 80px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 560px;
      height: 560px;
      top: -370px;
      left: 50%;
      border-radius: 50%;
      background: rgba(77, 163, 255, 0.14);
      filter: blur(100px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
    }

    .eyebrow {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 22px;
      font-size: clamp(46px, 8vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 640px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: clamp(18px, 2.5vw, 21px);
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .action-row a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 650;
      font-size: 15px;
    }

    .action-primary {
      background: var(--accent);
      color: #061018;
    }

    .action-secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }

    .action-secondary:hover,
    .action-secondary:focus-visible {
      border-color: var(--accent);
    }

    footer {
      padding: 28px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    footer p {
      margin: 0;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 12px;
    }

    .footer-links a {
      color: var(--muted);
      text-decoration: none;
    }

    .footer-links a:hover,
    .footer-links a:focus-visible {
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .container {
        width: min(calc(100% - 28px), var(--max-width));
      }

      .site-header {
        padding: 18px 0;
      }

      .hero {
        padding: 82px 0 58px;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="nav container" aria-label="Page navigation">
      <a class="brand" href="/">
        <img class="brand-logo" src="/assets/images/brand/logo-on-dark.svg" alt="Crux Horizon">
      </a>
      <a class="back-link" href="/">Home</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-content container">
        <p class="eyebrow">Error 404</p>
        <h1 id="page-title">Page not found</h1>
        <p class="intro">
          That address is not available on the Crux Horizon website. Use one of the links below to continue.
        </p>
        <div class="action-row">
          <a class="action-primary" href="/">Homepage</a>
          <a class="action-secondary" href="/support">Support</a>
          <a class="action-secondary" href="/privacy">Privacy</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 CRUX HORIZON PTY LTD. All rights reserved.</p>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="/">Crux Horizon</a>
        <a href="/support">Support</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="mailto:support@cruxhorizon.com">Email support</a>
      </nav>
    </div>
  </footer>
</body>
</html>
